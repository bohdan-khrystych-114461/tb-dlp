app = "tb-dlp"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/login"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "cookies_vol"
  destination = "/cookies"
